
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f3ef">
<title>BabyAlex</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f8f5f2;
 color:#403b38;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

header{
 padding:25px 20px 18px;
 background:#fff
}

h1{
 margin:0;
 font-size:27px;
 color:#806b83
}

header p{
 margin:6px 0 0;
 color:#938a87;
 font-size:14px
}

main{
 max-width:650px;
 margin:auto;
 padding:16px
}

.actions{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:9px
}

button{
 border:0;
 border-radius:14px;
 padding:14px 8px;
 background:#e9dfe9;
 color:#5e5063;
 font-size:14px;
 font-weight:600;
 cursor:pointer
}

button:active{opacity:.7}

.card{
 background:white;
 border-radius:18px;
 padding:17px;
 margin-top:14px;
 box-shadow:0 3px 14px #6c51440b
}

h2{
 font-size:18px;
 margin:0 0 13px
}

.muted{
 color:#99918d;
 font-size:13px
}

.timer{
 font-size:25px;
 font-weight:700;
 color:#806b83;
 margin:8px 0
}

input,select,textarea{
 width:100%;
 padding:12px;
 border:1px solid #e7dfda;
 border-radius:11px;
 margin:6px 0 12px;
 background:#fff;
 font:inherit;
 color:#403b38
}

label{
 font-size:13px;
 color:#817874
}

.primary{
 background:#88748d;
 color:white;
 width:100%;
 margin-top:5px
}

.event{
 padding:12px 0;
 border-bottom:1px solid #eee8e4
}

.event:last-child{border:0}

.event strong{display:block}

.event small{color:#99918d}

.event-actions{
 display:flex;
 gap:8px;
 margin-top:10px
}

.event-actions button{
 padding:8px 12px;
 font-size:12px
}

.event-actions .delete{
 background:#f5e5e2;
 color:#9b5c54
}

.tabs{
 display:flex;
 gap:8px;
 overflow:auto;
 margin-top:16px
}

.tabs button{
 white-space:nowrap;
 background:#eee8e4
}

.tabs button.active{
 background:#88748d;
 color:white
}

.hidden{display:none}

.timeline-controls{
 display:flex;
 gap:8px;
 align-items:center
}

.timeline-controls button{
 min-width:42px;
 padding:12px
}

.timeline-controls input{
 margin:0;
 min-width:0
}

.today-button{
 width:100%;
 margin-top:10px
}

#editModal{
 position:fixed;
 inset:0;
 z-index:1000;
 background:#403b3866;
 padding:20px;
 display:flex;
 align-items:center;
 justify-content:center;
 overflow-y:auto
}

#editModal.hidden{display:none}

#editModal .card{
 width:100%;
 max-width:450px;
 max-height:90vh;
 overflow-y:auto;
 margin:auto
}

#editModal label{
 display:block;
 margin-top:12px;
 margin-bottom:5px
}

#editModal input,
#editModal textarea{
 width:100%;
 box-sizing:border-box;
 margin-bottom:8px
}

#editModal button{
 width:100%;
 margin-top:8px
}
 
.event small{
 font-size:16px;
 color:#817874;
 line-height:1.5;
}

</style>
</head>

<body>

<header>
 <h1>BabyAlex ♡</h1>
 <p>Дневник Александра</p>
</header>

<main>

<div class="actions">
 <button id="sleepBtn" onclick="toggleTimer('sleep')">🌙 Уснул</button>
 <button id="walkBtn" onclick="toggleTimer('walk')">🚶 Вышли гулять</button>
 <button onclick="showTab('add')">＋ Добавить</button>
</div>

<div id="activeTimers"></div>

<div class="card">
 <h2>🍼 Последнее кормление</h2>
 <div id="lastFeed" class="muted">Пока нет записей</div>
</div>

<div class="tabs">
 <button class="active" onclick="showTab('home',this)">Главная</button>
 <button onclick="showTab('growth',this)">Рост и вес</button>
</div>

<section id="home">

 <div class="card">
  <h2 id="timelineTitle">Сегодня</h2>

  <div class="timeline-controls">
   <button onclick="changeTimelineDay(-1)">‹</button>

   <input
    id="timelineDate"
    type="date"
    onchange="render()"
   >

   <button onclick="changeTimelineDay(1)">›</button>
  </div>

  <button class="today-button" onclick="goToToday()">
   Сегодня
  </button>

  <div id="timeline" class="muted" style="margin-top:12px">
   Пока нет событий
  </div>
 </div>

 <div class="card">
  <h2>💾 Резервная копия</h2>

  <p class="muted">
   Сохрани записи Александра в файл, чтобы их можно было восстановить.
  </p>

  <button class="primary" onclick="exportData()">
   📥 Сохранить резервную копию
  </button>

  <button onclick="document.getElementById('importFile').click()">
   📤 Восстановить из файла
  </button>

  <input
   id="importFile"
   type="file"
   accept=".json,application/json"
   style="display:none"
   onchange="importData(event)"
  >
 </div>

</section>

<section id="add" class="hidden">

 <div class="card">
  <h2>Добавить кормление</h2>

  <label>Время</label>
  <input id="feedTime" type="datetime-local">

  <label>Объём смеси (мл)</label>
  <input id="feedAmount" type="number" placeholder="180">

  <button class="primary" onclick="addEvent('feeding')">
   Сохранить кормление
  </button>
 </div>

 <div class="card">
  <h2>Добавить прикорм</h2>

  <label>Продукт</label>
  <input id="mealName" placeholder="Например, кабачок">

  <label>Количество</label>
  <input id="mealAmount" placeholder="Например, 2 чайные ложки">

  <label>Заметки</label>
  <textarea id="mealNote" placeholder="Реакция малыша..."></textarea>

  <button class="primary" onclick="addEvent('meal')">
   Сохранить прикорм
  </button>
 </div>

</section>

<section id="growth" class="hidden">

 <div class="card">
  <h2>📏 Рост и вес</h2>

  <label>Дата измерения</label>
  <input id="growthDate" type="date">

  <label>Рост (см)</label>
  <input id="height" type="number" step="0.1">

  <label>Вес (г)</label>
  <input id="weight" type="number">

  <button class="primary" onclick="addEvent('growth')">
   Сохранить измерение
  </button>

  <div id="growthList"></div>
 </div>

</section>

</main>

<!-- Окно редактирования -->

<div id="editModal" class="hidden">

 <div class="card">
  <h2>Редактирование записи</h2>

  <label>Дата</label>
  <input id="editDate" type="date">

  <label>Время</label>
  <input id="editTime" type="time">

  <div id="editFields"></div>

  <button class="primary" onclick="saveEditedEvent()">
   Сохранить изменения
  </button>

  <button onclick="closeEdit()">Отмена</button>
 </div>

</div>

<script>

let events=JSON.parse(localStorage.getItem('babyAlexEvents')||'[]');
let timers=JSON.parse(localStorage.getItem('babyAlexTimers')||'{}');

let editingEventId=null;

function nowLocal(){
 const d=new Date();

 return new Date(d.getTime()-d.getTimezoneOffset()*60000)
  .toISOString().slice(0,16);
}

function todayLocal(){
 return nowLocal().slice(0,10);
}

// Выбранная дата хронологии

let selectedTimelineDate=todayLocal();

document.getElementById('feedTime').value=nowLocal();
document.getElementById('growthDate').value=todayLocal();
document.getElementById('timelineDate').value=selectedTimelineDate;

// Переключение даты хронологии

function changeTimelineDay(amount){

 const date=new Date(selectedTimelineDate+'T12:00:00');

 date.setDate(date.getDate()+amount);

 selectedTimelineDate=
  date.getFullYear()+'-'+
  String(date.getMonth()+1).padStart(2,'0')+'-'+
  String(date.getDate()).padStart(2,'0');

 document.getElementById('timelineDate').value=selectedTimelineDate;

 render();
}

// Возврат к сегодняшнему дню

function goToToday(){

 selectedTimelineDate=todayLocal();

 document.getElementById('timelineDate').value=selectedTimelineDate;

 render();
}

function save(){

 localStorage.setItem('babyAlexEvents',JSON.stringify(events));
 localStorage.setItem('babyAlexTimers',JSON.stringify(timers));

 render();
}

function addEvent(type){

 const id=Date.now();

 let item={
  id,
  type,
  date:new Date().toISOString()
 };

 if(type==='feeding'){

  const value=document.getElementById('feedTime').value;

  if(!value)return alert('Укажи время кормления');

  item.date=new Date(value).toISOString();

  item.amount=document.getElementById('feedAmount').value;

  if(!item.amount)return alert('Укажи объём смеси');
 }

 if(type==='meal'){

  item.name=document.getElementById('mealName').value;
  item.amount=document.getElementById('mealAmount').value;
  item.note=document.getElementById('mealNote').value;

  if(!item.name)return alert('Укажи продукт');
 }

 if(type==='growth'){

  const value=document.getElementById('growthDate').value;

  if(!value)return alert('Укажи дату измерения');

  item.date=new Date(value+'T12:00:00').toISOString();

  item.height=document.getElementById('height').value;
  item.weight=document.getElementById('weight').value;

  if(!item.height&&!item.weight){
   return alert('Укажи рост или вес');
  }
 }

 events.push(item);

 save();

 alert('Запись сохранена!');
}

function toggleTimer(type){

 if(timers[type]){

  const start=new Date(timers[type]).getTime();

  events.push({
   id:Date.now(),
   type,
   date:new Date().toISOString(),
   start:timers[type],
   duration:Math.round((Date.now()-start)/60000)
  });

  delete timers[type];

 }else{

  timers[type]=new Date().toISOString();
 }

 save();
}

function showTab(name,button){

 ['home','add','growth'].forEach(id=>{
  document.getElementById(id).classList.toggle('hidden',id!==name);
 });

 document.querySelectorAll('.tabs button').forEach(b=>{
  b.classList.remove('active');
 });

 if(button){

  button.classList.add('active');

 }else if(name==='home'){

  document.querySelectorAll('.tabs button')[0].classList.add('active');

 }else if(name==='growth'){

  document.querySelectorAll('.tabs button')[1].classList.add('active');
 }
}

function fmt(date){

 return new Date(date).toLocaleString('ru-RU',{
  day:'numeric',
  month:'short',
  hour:'2-digit',
  minute:'2-digit'
 });
}

function escapeHTML(value){

 return String(value??'').replace(/[&<>"']/g,char=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[char]));
}

// Редактирование записи

function editEvent(id){

 const e=events.find(x=>String(x.id)===String(id));

 if(!e)return;

 editingEventId=id;

 const date=new Date(e.date);

 document.getElementById('editDate').value=
  date.getFullYear()+'-'+
  String(date.getMonth()+1).padStart(2,'0')+'-'+
  String(date.getDate()).padStart(2,'0');

 document.getElementById('editTime').value=
  String(date.getHours()).padStart(2,'0')+':'+
  String(date.getMinutes()).padStart(2,'0');

 let fields='';

 if(e.type==='feeding'){

  fields=
   '<label>Объём смеси (мл)</label>'+
   '<input id="editAmount" type="number" value="'+escapeHTML(e.amount)+'">';
 }

 if(e.type==='meal'){

  fields=
   '<label>Продукт</label>'+
   '<input id="editName" value="'+escapeHTML(e.name)+'">'+
   '<label>Количество</label>'+
   '<input id="editAmount" value="'+escapeHTML(e.amount)+'">'+
   '<label>Заметки</label>'+
   '<textarea id="editNote">'+escapeHTML(e.note)+'</textarea>';
 }

 if(e.type==='growth'){

  fields=
   '<label>Рост (см)</label>'+
   '<input id="editHeight" type="number" step="0.1" value="'+escapeHTML(e.height)+'">'+
   '<label>Вес (г)</label>'+
   '<input id="editWeight" type="number" value="'+escapeHTML(e.weight)+'">';
 }

 if(e.type==='sleep'||e.type==='walk'){

  fields=
   '<label>Длительность (минуты)</label>'+
   '<input id="editDuration" type="number" min="0" value="'+escapeHTML(e.duration)+'">';
 }

 document.getElementById('editFields').innerHTML=fields;

 document.getElementById('editModal').classList.remove('hidden');
}

function closeEdit(){

 document.getElementById('editModal').classList.add('hidden');

 editingEventId=null;
}

function saveEditedEvent(){

 const e=events.find(x=>String(x.id)===String(editingEventId));

 if(!e)return;

 const dateValue=document.getElementById('editDate').value;
 const timeValue=document.getElementById('editTime').value;

 if(!dateValue||!timeValue){
  alert('Укажи дату и время');
  return;
 }

 const date=new Date(dateValue+'T'+timeValue);

 if(isNaN(date.getTime())){
  alert('Некорректная дата или время');
  return;
 }

 const getValue=id=>document.getElementById(id)?.value??'';

 if(e.type==='sleep'||e.type==='walk'){

  const durationValue=getValue('editDuration');
  const duration=Number(durationValue);

  if(durationValue===''||!Number.isFinite(duration)||duration<0){
   alert('Проверь длительность');
   return;
  }

  e.duration=duration;

  e.start=new Date(date.getTime()-duration*60000).toISOString();
 }

 if(e.type==='feeding'){

  e.amount=getValue('editAmount');

  if(!e.amount){
   alert('Укажи объём смеси');
   return;
  }
 }

 if(e.type==='meal'){

  e.name=getValue('editName');
  e.amount=getValue('editAmount');
  e.note=getValue('editNote');

  if(!e.name){
   alert('Укажи продукт');
   return;
  }
 }

 if(e.type==='growth'){

  e.height=getValue('editHeight');
  e.weight=getValue('editWeight');

  if(!e.height&&!e.weight){
   alert('Укажи рост или вес');
   return;
  }
 }

 e.date=date.toISOString();

 closeEdit();

 save();
}

// Резервное копирование — экспорт

function exportData(){

 const backup={
  app:'BabyAlex',
  version:1,
  exportedAt:new Date().toISOString(),
  events:events,
  timers:timers
 };

 const content=JSON.stringify(backup,null,2);

 const blob=new Blob([content],{
  type:'application/json'
 });

 const url=URL.createObjectURL(blob);

 const link=document.createElement('a');

 link.href=url;

 const date=new Date().toISOString().slice(0,10);

 link.download='BabyAlex-backup-'+date+'.json';

 document.body.appendChild(link);

 link.click();

 link.remove();

 URL.revokeObjectURL(url);

 alert('Резервная копия подготовлена!');
}

// Удаление записи

function deleteEvent(id){

 if(!confirm('Удалить эту запись?'))return;

 events=events.filter(e=>String(e.id)!==String(id));

 save();
}

// Резервное копирование — импорт

function importData(event){

 const file=event.target.files[0];

 if(!file)return;

 const reader=new FileReader();

 reader.onload=function(){

  try{

   const backup=JSON.parse(reader.result);

   if(
    !backup||
    backup.app!=='BabyAlex'||
    !Array.isArray(backup.events)||
    !backup.timers||
    typeof backup.timers!=='object'||
    Array.isArray(backup.timers)
   ){

    alert('Этот файл не похож на резервную копию BabyAlex.');

    return;
   }

   if(!confirm('Восстановить данные из файла? Текущие записи на этом устройстве будут заменены.')){

    return;
   }

   events=backup.events;
   timers=backup.timers;

   save();

   alert('Данные успешно восстановлены!');

  }catch(error){

   alert('Не удалось прочитать файл резервной копии.');

  }finally{

   event.target.value='';
  }
 };

 reader.onerror=function(){

  alert('Не удалось прочитать файл.');

  event.target.value='';
 };

 reader.readAsText(file);
}

// Отображение данных

function render(){

 const dateInput=document.getElementById('timelineDate');

 if(dateInput&&dateInput.value){

  selectedTimelineDate=dateInput.value;
 }

 const list=[...events].sort((a,b)=>
  new Date(b.date)-new Date(a.date)
 );

 // Фильтрация событий по выбранной дате


const selectedEvents=list.filter(e=>{

  const d=new Date(e.date);

  const localDate=
   d.getFullYear()+'-'+
   String(d.getMonth()+1).padStart(2,'0')+'-'+
   String(d.getDate()).padStart(2,'0');

  return localDate===selectedTimelineDate;

 }).sort((a,b)=>new Date(a.date)-new Date(b.date));


 // Заголовок выбранной даты

 const isToday=selectedTimelineDate===todayLocal();

 const selectedDateLabel=new Date(selectedTimelineDate+'T12:00:00')
  .toLocaleDateString('ru-RU',{
   day:'numeric',
   month:'long',
   year:'numeric'
  });

 document.getElementById('timelineTitle').textContent=
  isToday?'Сегодня':selectedDateLabel;

 if(dateInput){
  dateInput.value=selectedTimelineDate;
 }

 // Хронология

 document.getElementById('timeline').innerHTML=

 selectedEvents.length?selectedEvents.map(e=>{

  let title=
   e.type==='feeding'
    ?'🍼 Кормление — '+escapeHTML(e.amount)+' мл'
   :e.type==='meal'
    ?'🥣 '+escapeHTML(e.name)
   :e.type==='sleep'
    ?'🌙 Сон'
   :e.type==='walk'
    ?'🚶 Прогулка'
   :'📏 Измерение роста и веса';

  let detail=
   e.type==='growth'
    ?'Рост: '+escapeHTML(e.height||'—')+' см · Вес: '+escapeHTML(e.weight||'—')+' г'
   :e.type==='meal'
    ?escapeHTML(e.amount||'')+' '+escapeHTML(e.note||'')
   :['sleep','walk'].includes(e.type)
    ?'Длительность: '+escapeHTML(e.duration)+' мин'
   :'';

  return '<div class="event">'+
   '<strong>'+title+'</strong>'+
   '<small>'+fmt(e.date)+' · '+detail+'</small>'+
   '<div class="event-actions">'+
   '<button onclick="editEvent('+JSON.stringify(e.id)+')">✏️ Редактировать</button>'+
   '<button class="delete" onclick="deleteEvent('+JSON.stringify(e.id)+')">🗑 Удалить</button>'+
   '</div></div>';

 }).join(''):'Нет событий за выбранную дату';

 // Последнее кормление или прикорм

 const feeds=list.filter(e=>
  e.type==='feeding'||e.type==='meal'
 );

 const lastFeed=feeds[0];

 document.getElementById('lastFeed').innerHTML=lastFeed?

  (lastFeed.type==='feeding'
   ?'Смесь, '+escapeHTML(lastFeed.amount)+' мл'
   :'Прикорм: '+escapeHTML(lastFeed.name))+

  '<br><span class="muted">'+fmt(lastFeed.date)+'</span>'+

  '<div class="timer" id="feedElapsed"></div>'

  :'Пока нет записей';

 if(lastFeed){

  const minutes=Math.max(0,Math.floor(
   (Date.now()-new Date(lastFeed.date).getTime())/60000
  ));

  document.getElementById('feedElapsed').textContent=
   'Прошло: '+Math.floor(minutes/60)+' ч '+(minutes%60)+' мин';
 }

 // Активные таймеры

 document.getElementById('activeTimers').innerHTML=

 ['sleep','walk'].filter(t=>timers[t]).map(t=>{

  const name=t==='sleep'
   ?'🌙 Александр спит'
   :'🚶 На прогулке';

  const elapsed=Math.max(0,Math.floor(
   (Date.now()-new Date(timers[t]).getTime())/60000
  ));

  return '<div class="card">'+
   '<strong>'+name+'</strong>'+
   '<div class="timer">'+Math.floor(elapsed/60)+' ч '+(elapsed%60)+' мин</div>'+
   '<div class="muted">Начало: '+fmt(timers[t])+'</div>'+
   '</div>';

 }).join('');

 // Кнопки сна и прогулки

 document.getElementById('sleepBtn').textContent=
  timers.sleep?'🌙 Проснулся':'🌙 Уснул';

 document.getElementById('walkBtn').textContent=
  timers.walk?'🚶 Вернулись':'🚶 Вышли гулять';

 // Список измерений роста и веса

 document.getElementById('growthList').innerHTML=

 list.filter(e=>e.type==='growth').map(e=>

  '<div class="event">'+
  fmt(e.date)+'<br>'+
  'Рост: '+escapeHTML(e.height||'—')+' см · Вес: '+escapeHTML(e.weight||'—')+' г'+
  '<div class="event-actions">'+
  '<button onclick="editEvent('+JSON.stringify(e.id)+')">✏️ Редактировать</button>'+
  '<button class="delete" onclick="deleteEvent('+JSON.stringify(e.id)+')">🗑 Удалить</button>'+
  '</div></div>'

 ).join('');
}

// Первый запуск

render();

// Обновление таймеров каждые 30 секунд

setInterval(render,30000);

</script>

</body>
</html>
